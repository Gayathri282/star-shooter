<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Knife Toss! 🔪</title>
  <meta name="description" content="Throw knives onto the spinning wheel without hitting others!">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fullscreen Game Canvas -->
  <canvas id="arena"></canvas>

  <!-- Minimalist Floating Top HUD Pill for Points -->
  <div class="hud-bar">
    <div class="score-pill">
      <span class="pill-item">🏆 <b id="score">0</b></span>
      <span class="pill-divider"></span>
      <span class="pill-item">LVL <b id="level">1</b></span>
      <span class="pill-divider"></span>
      <span class="pill-item">BEST <b id="best">0</b></span>
    </div>
    <button class="audio-btn" id="audioBtn" title="Toggle Sound" aria-label="Toggle Sound">
      <span id="audioIcon">🔊</span>
    </button>
  </div>

  <!-- Message Overlay (Start / Level Advance / Game Over) -->
  <div class="overlay hidden" id="overlay">
    <div class="overlay-box">
      <div class="overlay-emoji" id="overlayEmoji">🔪</div>
      <div class="overlay-title" id="overlayTitle">Knife Toss!</div>
      <div class="overlay-sub"  id="overlaySub">Throw knives on the spinning wheel!</div>
      <button class="play-btn" id="playBtn">START! 🎮</button>
    </div>
  </div>

  <!-- Tiny Floating Throw Button at Bottom -->
  <button class="throw-btn" id="throwBtn">🔪 THROW</button>

  <script src="script.js"></script>
</body>
</html>
