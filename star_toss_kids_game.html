<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Knife Hit - Blade Thrower</title>
  <meta name="description" content="Throw knives at the spinning log without hitting other knives. How many can you land?">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fullscreen Game Canvas (Playfield First) -->
  <canvas id="arena"></canvas>

  <!-- Playfield-First Minimal Top HUD Header -->
  <header class="top-header">
    <div class="game-title">Knife Hit! 🔪</div>
    <div class="hud-pill">
      <span class="hud-item">🏆 <b id="score">0</b></span>
      <span class="hud-divider"></span>
      <span class="hud-item">LV <b id="level">1</b></span>
      <span class="hud-divider"></span>
      <span class="hud-item">BEST <b id="best">0</b></span>
    </div>
    <button class="help-btn" id="helpBtn" aria-label="How to Play">?</button>
  </header>

  <!-- How to Play Compact Overlay Modal -->
  <div class="modal-backdrop hidden" id="helpModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>How to Play</h3>
        <button class="close-btn" id="closeHelpBtn" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="help-item">
          <span class="help-icon">🎮</span>
          <span>Tap or Click to throw blade</span>
        </div>
        <div class="help-item">
          <span class="help-icon">🎯</span>
          <span>Land blades on the spinning wheel</span>
        </div>
        <div class="help-item">
          <span class="help-icon">🪨</span>
          <span>Avoid obstacles &amp; stuck blades</span>
        </div>
        <div class="help-item">
          <span class="help-icon">⭐</span>
          <span>Earn points &amp; reach higher levels</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Compact Game Over Modal -->
  <div class="modal-backdrop hidden" id="gameOverModal">
    <div class="modal-card game-over-card">
      <div class="modal-emoji" id="gameOverEmoji">💥</div>
      <h3 id="gameOverTitle">Game Over!</h3>
      <p id="gameOverSub">Knife hit another blade!</p>
      <div class="modal-stats">
        <div>Score: <b id="finalScore">0</b></div>
        <div>Best: <b id="finalBest">0</b></div>
      </div>
      <button class="retry-btn" id="retryBtn">PLAY AGAIN 🔄</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
