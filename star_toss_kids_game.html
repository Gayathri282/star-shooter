<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Knife Hit - Blade Thrower</title>
  <meta name="description" content="Throw knives at the spinning log without hitting other knives. How many can you land?">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game" id="gameRoot">
    <header class="header-bar">
      <div class="title-group">
        <div class="title">🔪 Knife Hit</div>
        <div class="subtitle">Throw blades — don't hit other knives!</div>
      </div>
      <button class="audio-btn" id="audioBtn" title="Toggle Sound" aria-label="Toggle Sound">
        <span id="audioIcon">🔊</span>
      </button>
    </header>
    <div class="stats-grid">
      <div class="stat">
        <b id="score">0</b>
        <span>SCORE</span>
      </div>
      <div class="stat level-stat">
        <b id="level">1</b>
        <span>LEVEL</span>
      </div>
      <div class="stat knives-stat">
        <b id="knivesLeft">5</b>
        <span>KNIVES</span>
      </div>
    </div>
    <canvas id="arena" aria-label="Knife Hit game arena"></canvas>
    <div class="message hidden" id="message">
      <h2 id="msgTitle">Ready? 🔪</h2>
      <p id="msgBody">Tap or press Space to throw!</p>
      <button class="btn again-btn hidden" id="again">PLAY AGAIN ⚔️</button>
    </div>
    <div class="controls">
      <button class="btn throw-btn" id="throw">🔪 THROW KNIFE</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
